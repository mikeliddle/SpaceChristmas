name: Build and test
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SpaceChristmas.sln
      - run: dotnet build SpaceChristmas.sln -c Release --no-restore
      - run: dotnet test SpaceChristmas.sln -c Release --no-build
      - run: dotnet publish SpaceChristmas-UX/SpaceChristmas-UX.csproj -c Release --no-build -o publish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:browser
      - run: docker build -t spacechristmas:ci .
